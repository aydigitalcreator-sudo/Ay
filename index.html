<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AY Digital</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mut:#5b6b85;--ac:#2540ff;--wa:#128c4a;--bd:#d5dce8;--red:#c62f3a}
*{box-sizing:border-box;margin:0}
body{font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;line-height:1.15}
header{position:sticky;top:0;z-index:5;background:var(--ink)}
nav{display:flex;gap:2px;overflow-x:auto;padding:8px 10px;align-items:center;max-width:960px;margin:auto}
nav b{color:#fff;font:700 18px Georgia,serif;margin-right:10px;white-space:nowrap}
nav a{color:#b9c4dc;text-decoration:none;padding:7px 12px;border-radius:8px;white-space:nowrap;font-size:14px}
nav a.on{background:#fff;color:var(--ink);font-weight:600}
main{max-width:960px;margin:auto;padding:24px 16px 70px}
.hero{padding:36px 0 28px}
.hero h1{font-size:clamp(2.1rem,8vw,3.4rem);max-width:12em;margin-bottom:14px}
.hero p{color:var(--mut);max-width:34em;margin-bottom:22px;font-size:1.05rem}
h2{font-size:1.7rem;margin-bottom:6px}.sub{color:var(--mut);margin-bottom:18px}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;padding:11px 20px;border-radius:8px;font:600 15px system-ui;cursor:pointer;text-decoration:none}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--bd)}.btn.wa{background:var(--wa)}.btn.red{background:var(--red)}.btn.sm{padding:6px 12px;font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px}
.card h3{font-size:1.15rem;margin-bottom:6px}.card p{color:var(--mut);font-size:14px;margin-bottom:14px}
.thumb{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:8px;background:#dfe5ef;margin-bottom:12px}
.gal{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scroll-snap-type:x mandatory}.gal img{flex:none;height:150px;width:auto;border-radius:8px;scroll-snap-align:start}
.pre{white-space:pre-line}
.svc{border-left:4px solid var(--ac)}
input,textarea,select{width:100%;background:#fff;color:var(--ink);border:1px solid var(--bd);border-radius:8px;padding:10px;font:inherit;margin-bottom:10px}
input:focus,textarea:focus,.btn:focus-visible,nav a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.item.h span{opacity:.45;text-decoration:line-through}
#modal{position:fixed;inset:0;background:#000c;display:none;flex-direction:column;z-index:20}
#modal.on{display:flex}#modal .row{padding:10px;background:var(--ink);color:#fff;justify-content:space-between}
#modal iframe{flex:1;border:0;background:#fff}
.empty{color:var(--mut);padding:20px 0}
.note{font-size:13px;color:var(--mut);margin-top:14px}
</style></head><body>

<main id="app"></main>

/* ====================== */
const PAGES=[["home","Home"],["services","Services"],["games","Games"],["work","My Work"],["ads","Advertising"],["contact","Contact"]];
const SVC=[["Websites","Fast, mobile-friendly sites for businesses and brands."],["Mobile apps","Android apps built and delivered as installable files."],["UI/UX design","Clean screens and flows people understand at once."],["Web tools & games","Custom calculators, converters and games for your audience."]];
let D,auth=false,tab="games",edit=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^(https?:\/\/|[\w.\/-]+$)/i.test(u||"")?u:"";
const save=()=>{try{localStorage.setItem("ayd",JSON.stringify(D))}catch(e){}};
async function init(){
 try{const l=localStorage.getItem("ayd");if(l)D=JSON.parse(l)}catch(e){}
 if(!D){try{const r=await fetch("data.json");D=await r.json()}catch(e){D=JSON.parse(JSON.stringify(DEF))}}
 addEventListener("hashchange",route);route();
}
function pic(x){
 const u=/^data:image\//.test(x.img||"")||/^https?:\/\//.test(x.img||"")?x.img:(/^https?:\/\//.test(x.url||"")?"https://image.thum.io/get/width/640/crop/800/"+x.url:"");
 return u?`<img class="thumb" loading="lazy" alt="" src="${esc(u)}" onerror="this.remove()">`:"";
}
function list(k,label){
 const L=D[k].filter(x=>!x.hidden);
 if(!L.length)return `<p class="empty">Nothing here yet. Check back soon.</p>`;
 return `<div class="grid">${L.map(x=>`<div class="card">${x.imgs&&x.imgs.length?`<div class="gal">${x.imgs.map(i=>`<img alt="" loading="lazy" src="${esc(i)}">`).join("")}</div>`:pic(x)}<h3>${esc(x.title)}</h3><p class="pre">${esc(x.desc)}</p>${x.wa?`<a class="btn wa sm" href="https://wa.me/${esc(x.wanum||C.wa)}?text=${encodeURIComponent(x.wa)}" target="_blank" rel="noopener">Chat on WhatsApp</a> `:""}${
  safe(x.url)?(k==="games"?`<button class="btn sm" onclick="openM(${x.id})">Play</button>`:`<a class="btn sm" href="${esc(safe(x.url))}" target="_blank" rel="noopener">${label}</a>`):""}</div>`).join("")}</div>`;
}
const V={
 home:()=>`<section class="hero"><h1>Websites, apps and games that work for your business.</h1><p>AY Digital designs and builds fast, simple digital products from Nigeria. Tell us what you need and we will get it live.</p><div class="row"><a class="btn" href="#contact">Get started</a><a class="btn alt" href="#work">See my work</a><a class="btn wa" href="#ads">Advertise with us</a></div></section>`,
 services:()=>`<h2>Services</h2><p class="sub">What we build for you.</p><div class="grid">${SVC.map(s=>`<div class="card svc"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("")}</div><p style="margin-top:20px"><a class="btn" href="#contact">Request a quote</a></p>`,
 games:()=>`<h2>Games</h2><p class="sub">Play our games right here.</p>${list("games","Play")}`,
 work:()=>`<h2>My Work</h2><p class="sub">Websites and apps we have built.</p>${list("work","Open")}`,
 ads:()=>`<h2>Advertising</h2><p class="sub">Featured businesses and products.</p><div class="card" style="margin-bottom:18px"><h3>Advertise with us</h3><p>Reach people who visit our games and tools. Message us for prices and available spots.</p><a class="btn wa" href="https://wa.me/${C.biz}?text=${encodeURIComponent("Hello AY Digital, I want to advertise.")}" target="_blank" rel="noopener">Advertise on WhatsApp</a></div>${list("ads","Visit")}`,
 contact:()=>`<h2>Contact</h2><p class="sub">Send your message to WhatsApp or call us directly.</p><div class="card"><input id="cn" placeholder="Your name" autocomplete="name"><textarea id="cm" rows="4" placeholder="What do you need?"></textarea><div class="row"><button class="btn wa" onclick="sendWA()">Send on WhatsApp</button><a class="btn alt" href="tel:${C.phone}">Call now</a></div></div>`,
 admin:()=>{
  if(!auth)return `<h2>Admin</h2><p class="sub">Enter your passcode.</p><div class="card"><input id="pw" type="password" placeholder="Passcode" autocomplete="current-password"><button class="btn" onclick="login()">Log in</button></div>`;
  const L=D[tab],cur=edit?L.find(x=>x.id===edit)||{}:{};
  return `<h2>Admin</h2><div class="row" style="margin-bottom:14px">${["games","work","ads"].map(t=>`<button class="btn sm ${t===tab?"":"alt"}" onclick="tab='${t}';edit=null;route()">${t==="work"?"projects":t}</button>`).join("")}<button class="btn sm alt" onclick="auth=false;route()">Log out</button></div>
  <div class="card"><h3>${edit?"Edit item":"Add item"}</h3><input id="ft" placeholder="Title" value="${esc(cur.title)}"><textarea id="fd" rows="2" placeholder="Short description">${esc(cur.desc)}</textarea><input id="fu" placeholder="Link (https://… or games/file.html)" value="${esc(cur.url)}"><label class="note" for="fi">Image (optional — leave empty to use an automatic preview of the link)</label><input id="fi" type="file" accept="image/*" style="margin-top:6px"><div class="row"><button class="btn" onclick="saveItem()">Save</button>${edit?`<button class="btn alt" onclick="edit=null;route()">Cancel</button>`:""}</div></div>
  <div style="margin-top:14px">${L.length?L.map(x=>`<div class="item ${x.hidden?"h":""}"><span>${esc(x.title)}</span><div class="row"><button class="btn sm alt" onclick="edit=${x.id};route();scrollTo(0,0)">Edit</button><button class="btn sm alt" onclick="tog(${x.id})">${x.hidden?"Show":"Hide"}</button><button class="btn sm red" onclick="del(${x.id})">Delete</button></div></div>`).join(""):`<p class="empty">No items yet. Add one above.</p>`}</div>
  <div class="row" style="margin-top:18px"><button class="btn" onclick="exp()">Download data.json</button><button class="btn alt" onclick="reset()">Reset this device</button></div>
  <div class="card" style="margin-top:18px"><h3>Change passcode</h3><input id="np" type="password" placeholder="New passcode (8+ characters)"><button class="btn sm" onclick="mkHash()">Make hash</button><input id="nh" readonly placeholder="Copy this hash into C.hash in index.html" style="margin-top:10px"></div><p class="note">Changes show on this device only. To publish them to visitors, download data.json and upload it next to index.html on your host.</p>`;
 }
};
function route(){
 let h=(location.hash||"#home").slice(1);if(h===C.path)h="admin";const p=V[h]?h:"home";if(p!=="admin")auth=false;
 $("#nav").innerHTML=`<b>AY Digital</b>`+PAGES.map(x=>`<a href="#${x[0]}" class="${x[0]===p?"on":""}">${x[1]}</a>`).join("");
 $("#app").innerHTML=V[p]();scrollTo(0,0);
}
function sendWA(){const n=$("#cn").value.trim(),m=$("#cm").value.trim();if(!m){$("#cm").focus();return}
 window.open(`https://wa.me/${C.wa}?text=${encodeURIComponent((n?`I am ${n}. `:"")+m)}`,"_blank")}
function openM(id){const g=D.games.find(x=>x.id===id);if(!g)return;$("#mt").textContent=g.title;$("#mf").src=safe(g.url);$("#modal").classList.add("on")}
function closeM(){$("#modal").classList.remove("on");$("#mf").src="about:blank"}
let tries=0,lockT=0;
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function login(){
 if(Date.now()<lockT){alert("Too many tries. Wait 30 seconds.");return}
 if(!window.crypto||!crypto.subtle){alert("Open the site over HTTPS to log in.");return}
 if(await sha($("#pw").value)===C.hash){auth=true;tries=0;route()}
 else{if(++tries>=5){lockT=Date.now()+30000;tries=0}alert("Wrong passcode.")}
}
async function mkHash(){const v=$("#np").value;if(v.length<8){alert("Use at least 8 characters.");return}$("#nh").value=await sha(v)}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const w=Math.min(640,i.width),c=document.createElement("canvas");c.width=w;c.height=i.height*w/i.width;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.72))};i.onerror=()=>r("");i.src=URL.createObjectURL(f)})}
async function saveItem(){
 const t=$("#ft").value.trim();if(!t){$("#ft").focus();return}
 const o={title:t,desc:$("#fd").value.trim(),url:$("#fu").value.trim()},L=D[tab],f=$("#fi").files[0];
 if(f){const d=await shrink(f);if(d)o.img=d}
 if(edit){Object.assign(L.find(x=>x.id===edit),o)}else{L.push({id:Date.now(),hidden:false,...o})}
 edit=null;save();route();
}
function tog(id){const x=D[tab].find(y=>y.id===id);x.hidden=!x.hidden;save();route()}
function del(id){if(confirm("Delete this item?")){D[tab]=D[tab].filter(x=>x.id!==id);save();route()}}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));a.download="data.json";a.click()}
function reset(){if(confirm("Clear local changes on this device?")){try{localStorage.removeItem("ayd")}catch(e){}location.reload()}}
init();
</script></body></html>
